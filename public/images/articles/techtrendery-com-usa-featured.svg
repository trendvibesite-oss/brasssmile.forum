<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#accentGlow)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Browser Frame Mockup -->
  <g filter="url(#shadow)">
    <rect x="80" y="55" width="1040" height="565" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Top Header -->
    <path d="M80 71 C80 62.163 87.163 55 96 55 L1104 55 C1112.837 55 1120 62.163 1120 71 L1120 105 L80 105 Z" fill="#1E293B"/>
    <line x1="80" y1="105" x2="1120" y2="105" stroke="#334155" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="112" cy="80" r="6" fill="#EF4444"/>
    <circle cx="132" cy="80" r="6" fill="#F59E0B"/>
    <circle cx="152" cy="80" r="6" fill="#10B981"/>

    <!-- Address Bar -->
    <rect x="220" y="68" width="560" height="26" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <g transform="translate(232, 74)">
      <!-- SSL Lock Icon -->
      <path d="M4 6V4a3 3 0 0 1 6 0v2m-7 0h8a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z" stroke="#10B981" stroke-width="1.5" fill="none"/>
      <text x="18" y="10" fill="#94A3B8" font-family="monospace" font-size="11">https://techtrendery.com/usa-context-guide</text>
    </g>

    <!-- USA Review Badge Top-Right -->
    <g transform="translate(930, 68)">
      <rect x="0" y="0" width="160" height="26" rx="13" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="14" cy="13" r="6" fill="#2563EB"/>
      <circle cx="14" cy="13" r="3" fill="#DC2626"/>
      <text x="28" y="17" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">USA MARKET AUDIT</text>
    </g>

    <!-- Main Content Inside Frame -->
    <!-- Left Column: Editorial Summary -->
    <g transform="translate(120, 140)">
      <!-- Category Tag -->
      <rect x="0" y="0" width="170" height="26" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
      <text x="12" y="17" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BUSINESS &amp; MEDIA STRATEGY</text>

      <!-- Headline -->
      <text x="0" y="65" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800">techtrendery.com usa</text>
      <text x="0" y="98" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Platform Analysis, Digital Architecture &amp; Content Review</text>

      <!-- Overview Paragraph -->
      <text x="0" y="132" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">An in-depth independent examination of TechTrendery’s editorial scope,</text>
      <text x="0" y="152" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">multi-topic publishing model, USA search intent, and online reliability.</text>

      <!-- Key Data Points Card -->
      <g transform="translate(0, 180)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="460" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>

        <!-- Stat 1 -->
        <g transform="translate(24, 25)">
          <text x="0" y="12" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PRIMARY QUERY</text>
          <text x="0" y="34" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="700">techtrendery.com usa</text>
          <text x="0" y="52" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">High-intent US informational search</text>
        </g>

        <!-- Divider -->
        <line x1="230" y1="20" x2="230" y2="80" stroke="#334155" stroke-width="1"/>

        <!-- Stat 2 -->
        <g transform="translate(250, 25)">
          <text x="0" y="12" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">EDITORIAL SCOPE</text>
          <text x="0" y="34" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Multi-Topic Network</text>
          <text x="0" y="52" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Tech, Business, News, Law, Health</text>
        </g>

        <!-- Lower horizontal divider -->
        <line x1="24" y1="95" x2="436" y2="95" stroke="#334155" stroke-width="1"/>

        <!-- Stat 3 -->
        <g transform="translate(24, 115)">
          <text x="0" y="12" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">GEOGRAPHIC STATUS</text>
          <text x="0" y="34" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Global .com domain with US audience relevance</text>
          <text x="0" y="48" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">No confirmed standalone US headquarters</text>
        </g>
      </g>
    </g>

    <!-- Right Column: Visual Infographic of Core Vectors -->
    <g transform="translate(630, 140)">
      <!-- Visual Card 1: Multi-Category Orbit -->
      <g filter="url(#cardShadow)">
        <rect x="0" y="0" width="450" height="225" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>

        <text x="24" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700">7 Core Publishing Verticals Analyzed</text>
        <line x1="24" y1="46" x2="426" y2="46" stroke="#334155" stroke-width="1"/>

        <!-- 6 Category Pills -->
        <!-- Technology -->
        <g transform="translate(24, 60)">
          <rect width="185" height="36" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
          <circle cx="18" cy="18" r="6" fill="#3B82F6"/>
          <text x="32" y="22" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Technology &amp; AI</text>
        </g>

        <!-- Business -->
        <g transform="translate(230, 60)">
          <rect width="195" height="36" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
          <circle cx="18" cy="18" r="6" fill="#F59E0B"/>
          <text x="32" y="22" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Business &amp; Growth</text>
        </g>

        <!-- News -->
        <g transform="translate(24, 108)">
          <rect width="185" height="36" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
          <circle cx="18" cy="18" r="6" fill="#94A3B8"/>
          <text x="32" y="22" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">News &amp; Trends</text>
        </g>

        <!-- Health -->
        <g transform="translate(230, 108)">
          <rect width="195" height="36" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
          <circle cx="18" cy="18" r="6" fill="#10B981"/>
          <text x="32" y="22" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Health &amp; Wellness</text>
        </g>

        <!-- Law -->
        <g transform="translate(24, 156)">
          <rect width="185" height="36" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
          <circle cx="18" cy="18" r="6" fill="#8B5CF6"/>
          <text x="32" y="22" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Law &amp; Jurisdictions</text>
        </g>

        <!-- Home Improvement -->
        <g transform="translate(230, 156)">
          <rect width="195" height="36" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1"/>
          <circle cx="18" cy="18" r="6" fill="#EC4899"/>
          <text x="32" y="22" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Home &amp; Lifestyle</text>
        </g>

        <!-- Education Tag -->
        <g transform="translate(24, 202)">
          <text x="0" y="10" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-style="italic">+ Education &amp; Learning Modules</text>
        </g>
      </g>

      <!-- Visual Card 2: Verification Protocol Status -->
      <g transform="translate(0, 245)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="450" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>

        <!-- Checkmark Badge -->
        <g transform="translate(24, 22)">
          <circle cx="16" cy="16" r="16" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
          <path d="M10 16 L14 20 L22 12" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <text x="70" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Verification Protocol Required</text>
        <text x="70" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Readers must independently verify author background, freshness,</text>
        <text x="70" y="70" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">jurisdiction applicability, and original citations before taking action.</text>
      </g>
    </g>

    <!-- Bottom Footer Bar Inside Frame -->
    <g transform="translate(120, 520)">
      <line x1="0" y1="0" x2="960" y2="0" stroke="#334155" stroke-width="1"/>
      <text x="0" y="25" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Published under BrassSmile Business Research &bull; Independent Digital Media Review</text>
      <text x="960" y="25" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">Peer-Reviewed Editorial Analysis</text>
    </g>
  </g>
</svg>
