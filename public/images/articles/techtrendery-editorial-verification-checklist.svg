<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bgGrad4)"/>
  <rect width="1000" height="520" rx="16" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect width="190" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <text x="95" y="16" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">CONTENT QUALITY AUDIT</text>
    <text x="0" y="52" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="800">6-Point Editorial Verification Checklist</text>
    <text x="0" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Framework for evaluating online technology, business, and informational publishing.</text>
  </g>

  <!-- 2x3 Grid of Verification Cards -->
  <!-- Row 1 -->
  <!-- Card 1: Accuracy -->
  <g transform="translate(40, 130)" filter="url(#shadow4)">
    <rect width="290" height="150" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#3B82F6" fill-opacity="0.15"/>
      <path d="M11 16 L15 20 L21 12" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="22" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">1. Accuracy</text>
      <text x="0" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRIMARY CRITERIA:</text>
      <text x="0" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Are factual assertions and technical claims supported by verifiable evidence and testing?</text>
    </g>
  </g>

  <!-- Card 2: Freshness -->
  <g transform="translate(355, 130)" filter="url(#shadow4)">
    <rect width="290" height="150" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#F59E0B" fill-opacity="0.15"/>
      <circle cx="16" cy="16" r="8" stroke="#FBBF24" stroke-width="1.5" fill="none"/>
      <polyline points="16,11 16,16 19,18" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
      <text x="44" y="22" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">2. Freshness</text>
      <text x="0" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRIMARY CRITERIA:</text>
      <text x="0" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Is the publication date recent enough for volatile topics like software, pricing, or regulations?</text>
    </g>
  </g>

  <!-- Card 3: Specificity -->
  <g transform="translate(670, 130)" filter="url(#shadow4)">
    <rect width="290" height="150" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#10B981" fill-opacity="0.15"/>
      <circle cx="16" cy="16" r="6" stroke="#34D399" stroke-width="2" fill="none"/>
      <line x1="16" y1="6" x2="16" y2="9" stroke="#34D399" stroke-width="1.5"/>
      <line x1="16" y1="23" x2="16" y2="26" stroke="#34D399" stroke-width="1.5"/>
      <line x1="6" y1="16" x2="9" y2="16" stroke="#34D399" stroke-width="1.5"/>
      <line x1="23" y1="16" x2="26" y2="16" stroke="#34D399" stroke-width="1.5"/>
      <text x="44" y="22" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">3. Specificity</text>
      <text x="0" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRIMARY CRITERIA:</text>
      <text x="0" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Does the article address exact software versions, models, or conditions rather than generic claims?</text>
    </g>
  </g>

  <!-- Row 2 -->
  <!-- Card 4: Transparency -->
  <g transform="translate(40, 310)" filter="url(#shadow4)">
    <rect width="290" height="150" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#8B5CF6" fill-opacity="0.15"/>
      <path d="M9 14 C12 9 20 9 23 14 C20 19 12 19 9 14 Z" stroke="#A78BFA" stroke-width="1.5" fill="none"/>
      <circle cx="16" cy="14" r="3" fill="#A78BFA"/>
      <text x="44" y="22" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">4. Transparency</text>
      <text x="0" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRIMARY CRITERIA:</text>
      <text x="0" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Are authors identifiable with verified experience, editorial corrections, and clear disclosures?</text>
    </g>
  </g>

  <!-- Card 5: Practical Value -->
  <g transform="translate(355, 310)" filter="url(#shadow4)">
    <rect width="290" height="150" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#06B6D4" fill-opacity="0.15"/>
      <path d="M11 21 L16 11 L21 21 H11 Z" stroke="#67E8F9" stroke-width="1.5" fill="none"/>
      <text x="44" y="22" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">5. Practical Value</text>
      <text x="0" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRIMARY CRITERIA:</text>
      <text x="0" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Can reader apply the guide to resolve the question, project, or operational decision?</text>
    </g>
  </g>

  <!-- Card 6: Limitations -->
  <g transform="translate(670, 310)" filter="url(#shadow4)">
    <rect width="290" height="150" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#EC4899" fill-opacity="0.15"/>
      <path d="M16 10 V18 M16 22 H16.01" stroke="#F472B6" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="22" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">6. Limitations</text>
      <text x="0" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRIMARY CRITERIA:</text>
      <text x="0" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Does the analysis acknowledge trade-offs, restrictions, risks, and jurisdiction caveats?</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 480)">
    <text x="0" y="15" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Framework Source: BrassSmile Editorial Verification Standards &bull; Digital Media Audit Protocol</text>
  </g>
</svg>
