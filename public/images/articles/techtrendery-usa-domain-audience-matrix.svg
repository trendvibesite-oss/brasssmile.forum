<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cardShadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bgGrad2)"/>
  <rect width="1000" height="520" rx="16" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect width="130" height="24" rx="12" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <text x="65" y="16" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">GEOGRAPHIC AUDIT</text>
    <text x="0" y="52" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Geographic Distinction: US Audience vs. US Publisher</text>
    <text x="0" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Clarifying search query intent, domain architecture, and legal jurisdiction signals.</text>
  </g>

  <!-- 4 Interactive Comparison Pillars -->
  <!-- Pillar 1: US Audience -->
  <g transform="translate(40, 140)" filter="url(#cardShadow2)">
    <rect width="210" height="300" rx="12" fill="url(#cardGrad2)" stroke="#3B82F6" stroke-width="1.5"/>
    <g transform="translate(20, 24)">
      <circle cx="20" cy="20" r="20" fill="#3B82F6" fill-opacity="0.15"/>
      <path d="M12 26 C12 22 16 19 20 19 C24 19 28 22 28 26 M20 16 A4 4 0 1 0 20 8 A4 4 0 1 0 20 16 Z" stroke="#60A5FA" stroke-width="2" fill="none"/>
      <text x="0" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">1. US Audience</text>
      <text x="0" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">WHAT IT MEANS:</text>
      <text x="0" y="110" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">People in the United States actively visit and read content.</text>
      <line x1="0" y1="140" x2="170" y2="140" stroke="#334155" stroke-width="1"/>
      <text x="0" y="162" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700">WHAT IT ESTABLISHES:</text>
      <text x="0" y="184" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Audience interest and traffic relevance.</text>
      <rect x="0" y="215" width="170" height="26" rx="6" fill="#334155"/>
      <text x="85" y="232" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">&ne; Ownership or Base</text>
    </g>
  </g>

  <!-- Pillar 2: US-Focused Content -->
  <g transform="translate(275, 140)" filter="url(#cardShadow2)">
    <rect width="210" height="300" rx="12" fill="url(#cardGrad2)" stroke="#10B981" stroke-width="1.5"/>
    <g transform="translate(20, 24)">
      <circle cx="20" cy="20" r="20" fill="#10B981" fill-opacity="0.15"/>
      <path d="M12 12 H28 M12 18 H24 M12 24 H20 M10 8 H30 V28 H10 Z" stroke="#34D399" stroke-width="2" fill="none"/>
      <text x="0" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">2. US Content</text>
      <text x="0" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">WHAT IT MEANS:</text>
      <text x="0" y="110" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Articles discuss American companies, tools, or laws.</text>
      <line x1="0" y1="140" x2="170" y2="140" stroke="#334155" stroke-width="1"/>
      <text x="0" y="162" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700">WHAT IT ESTABLISHES:</text>
      <text x="0" y="184" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Subject matter and editorial coverage.</text>
      <rect x="0" y="215" width="170" height="26" rx="6" fill="#334155"/>
      <text x="85" y="232" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">&ne; Physical Office</text>
    </g>
  </g>

  <!-- Pillar 3: US-Based Publisher -->
  <g transform="translate(510, 140)" filter="url(#cardShadow2)">
    <rect width="210" height="300" rx="12" fill="url(#cardGrad2)" stroke="#F59E0B" stroke-width="1.5"/>
    <g transform="translate(20, 24)">
      <circle cx="20" cy="20" r="20" fill="#F59E0B" fill-opacity="0.15"/>
      <path d="M12 28 V16 L20 10 L28 16 V28 Z M16 28 V20 H24 V28" stroke="#FBBF24" stroke-width="2" fill="none"/>
      <text x="0" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">3. US Publisher</text>
      <text x="0" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">WHAT IT MEANS:</text>
      <text x="0" y="110" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Operating business is legally registered in the US.</text>
      <line x1="0" y1="140" x2="170" y2="140" stroke="#334155" stroke-width="1"/>
      <text x="0" y="162" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700">WHAT IT ESTABLISHES:</text>
      <text x="0" y="184" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Corporate jurisdiction &amp; verified registry.</text>
      <rect x="0" y="215" width="170" height="26" rx="6" fill="#451A03" stroke="#B45309" stroke-width="1"/>
      <text x="85" y="232" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Requires Evidence</text>
    </g>
  </g>

  <!-- Pillar 4: .com Domain -->
  <g transform="translate(745, 140)" filter="url(#cardShadow2)">
    <rect width="210" height="300" rx="12" fill="url(#cardGrad2)" stroke="#8B5CF6" stroke-width="1.5"/>
    <g transform="translate(20, 24)">
      <circle cx="20" cy="20" r="20" fill="#8B5CF6" fill-opacity="0.15"/>
      <circle cx="20" cy="20" r="10" stroke="#A78BFA" stroke-width="2" fill="none"/>
      <line x1="10" y1="20" x2="30" y2="20" stroke="#A78BFA" stroke-width="2"/>
      <path d="M20 10 C16 14 16 26 20 30 C24 26 24 14 20 10 Z" stroke="#A78BFA" stroke-width="1.5" fill="none"/>
      <text x="0" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">4. .com Domain</text>
      <text x="0" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">WHAT IT MEANS:</text>
      <text x="0" y="110" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Uses a globally accessible generic top-level domain.</text>
      <line x1="0" y1="140" x2="170" y2="140" stroke="#334155" stroke-width="1"/>
      <text x="0" y="162" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700">WHAT IT ESTABLISHES:</text>
      <text x="0" y="184" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Global web availability only.</text>
      <rect x="0" y="215" width="170" height="26" rx="6" fill="#334155"/>
      <text x="85" y="232" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">&ne; US Location</text>
    </g>
  </g>

  <!-- Footer Insight Banner -->
  <g transform="translate(40, 465)">
    <text x="0" y="15" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Core Finding: The phrase "techtrendery.com usa" reflects audience intent rather than verified corporate location.</text>
  </g>
</svg>
